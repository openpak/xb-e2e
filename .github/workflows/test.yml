name: e2e

# Runs only on pushed release tags (and manually), like every OpenPak repository.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      GOWORK: 'off'
      GOFLAGS: -buildvcs=false
      GOPRIVATE: github.com/openpak/*
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Module token
        env:
          MODULE_TOKEN: ${{ secrets.OPENPAK_MODULE_TOKEN }}
        run: |
          umask 077
          if [ -z "${MODULE_TOKEN:-}" ]; then echo "::error::OPENPAK_MODULE_TOKEN is not set" >&2; exit 1; fi
          printf 'machine github.com login x-access-token password %s\n' "$MODULE_TOKEN" > ~/.netrc
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - if: always()
        run: rm -f ~/.netrc
